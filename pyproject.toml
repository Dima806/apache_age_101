[project]
name = "apache-age-101"
version = "0.1.0"
description = "Apache AGE 101: the graph database hiding inside your Postgres"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "networkx>=3.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "pyvis>=0.3.2",
    "streamlit>=1.38",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
algos = [
    "python-igraph>=0.11",   # faster graph algorithms for the honest-limit chapter
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.1a7",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbclient>=0.10",
]

# Code is imported as the top-level `src` package and run from the repo root
# (e.g. `python -m src.datasets.graphs`), so uv manages the environment without
# installing this project itself as a wheel.
[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
